  async function wander(dead) {

  async function wave(dead) {

    st.pose = 'stand';
    await idle(dead, 700);
  }

  async function hide(dead) {
    st.mode = 'sneak';
    expr('happy');
    var r = Math.random();

      st.mode = 'hiding';
      var end = now() + rand(5000, 8500);
      while (now() < end) {

    st.mode = 'hiding';
    await wait(rand(1000, 1800)); if (dead()) return;
    var end2 = now() + rand(5000, 9000);

      st.forceFace = 0;

  async function found(dead) {

  /* ---------- body mechanics ---------- */

    var a = Math.atan2(dy, dx);

    var kx = hx + THIGH * Math.cos(a - b), ky = hy + THIGH * Math.sin(a - b);
    var tx = fx + 11 * Math.cos(toe), ty = fy + 11 * Math.sin(toe);
    return 'M' + hx.toFixed(1) + ',' + hy.toFixed(1) + ' L' + kx.toFixed(1) + ',' + ky.toFixed(1) +
      ' L' + fx.toFixed(1) + ',' + fy.toFixed(1) + ' L' + tx.toFixed(1) + ',' + ty.toFixed(1);
  }
  function armPath(i, deg) {

  }
  function eyeT(c, sx, sy) {

      var overshoot = (dx * (st.tx - nx) + dy * (st.ty - ny)) < 0;
      st.x = nx; st.gy = ny;
      if ((dist < 1.5 && Math.hypot(st.vx, st.vy) < 25) || overshoot) {
        st.x = st.tx; st.gy = st.ty; st.vx = 0; st.vy = 0; if (st.arrive) st.arrive(true);
      }
    } else {
      st.vx += clamp(-st.vx, -900 * dt, 900 * dt);
      st.vy += clamp(-st.vy, -900 * dt, 900 * dt);
      st.x += st.vx * dt; st.gy += st.vy * dt;
    }
    st.sp = Math.hypot(st.vx, st.vy);

    /* gait from real ground speed, so feet don't slide */
    var speedU = st.sp / S;                         // drawing units / s
    var cycle = clamp(70 + speedU * 0.09, 70, 150);           // stride length (units)
    st.phase += 2 * Math.PI * speedU * dt / cycle;
    st.gait = lerp(st.gait, clamp(st.sp / 25, 0, 1), Math.min(1, dt * 10));
    var running = st.sp > 180;
    var A = cycle / 4, lift = running ? 22 : 11;

    /* vertical: jumps, crouch, hiding sink */
    if (st.jy < 0 || st.jvy < 0) {
      st.jvy += 1700 * dt; st.jy += st.jvy * dt;
      if (st.jy >= 0) { st.jy = 0; st.jvy = 0; st.squash = 1; }
    }
    st.squash = Math.max(0, st.squash - dt * 6);
    st.sink = lerp(st.sink, st.sinkT, Math.min(1, dt * 7));
    st.crouch = lerp(st.crouch, st.crouchT, Math.min(1, dt * 12));

    /* facing: quick squash-turn instead of a mirror snap */
    var facing = st.moving && Math.abs(st.vx) > 6 ? st.face : (st.forceFace || st.face);
    if (!st.moving && !st.forceFace && distMouse() < 280 && st.sp < 4) facing = mouse.x < center().x ? -1 : 1;
    if (!st.moving) st.face = facing;
    st.flip += clamp(facing - st.flip, -dt * 12, dt * 12);
    var fl = Math.abs(st.flip) < 0.15 ? 0.15 * Math.sign(st.flip || 1) : st.flip;

    /* legs */
    var bob = 0, legs = [], airborne = st.jy < -0.5;
    for (var i = 0; i < 2; i++) {
      var qp = (st.phase + i * Math.PI) % (2 * Math.PI), fx, fy, toe = 0;
      if (qp < Math.PI) { var u = qp / Math.PI; fx = A * (1 - 2 * u); fy = 0; }
      else { var u2 = (qp - Math.PI) / Math.PI, sm = u2 * u2 * (3 - 2 * u2); fx = A * (-1 + 2 * sm); fy = -lift * Math.sin(Math.PI * u2); toe = -0.35 * Math.sin(Math.PI * u2); }
      fx *= st.gait; fy *= st.gait; toe *= st.gait;
      if (st.stomp) {                                          // angry stomping, one foot
        var sp = Math.sin(time * 15);
        if (i === (st.stomp === 2 ? (Math.sin(time * 7.5) > 0 ? 0 : 1) : 1)) fy = Math.min(fy, -Math.max(0, sp) * 16);
      }
      if (airborne) { fy = -10 + st.jvy * 0.012; fx = (i ? -6 : 6); }
      legs.push([fx, fy, toe]);
    }
    bob = st.gait * (running ? 9 : 5) * Math.pow(Math.sin(st.phase), 2);
    var hipDrop = st.crouch;
    var sitting = st.pose === 'sit';
    for (var j = 0; j < 2; j++) {
      var hx = HIPS[j], hy = HIPY - bob + hipDrop + (sitting ? 26 : 0);
      if (sitting) {
        el.leg[j].setAttribute('d', 'M' + hx + ',' + hy + ' L' + (hx + 30) + ',' + (GROUND - 2) + ' L' + (hx + 38) + ',' + (GROUND - 12));
      } else {
        el.leg[j].setAttribute('d', legPath(hx, hy, hx + legs[j][0], GROUND + legs[j][1], legs[j][2]));
      }
    }

    /* body lean, bob, squash */
    st.lean = lerp(st.lean, (st.mode === 'wind' ? st.leanT : (running ? 9 : 3) * Math.min(1, st.sp / 60)), Math.min(1, dt * 6));
    var breathe = st.gait < 0.1 ? Math.sin(time * 2.2) * 1.2 : 0;
    var sq = st.squash * 0.08;
    var rigY = -bob + hipDrop + (sitting ? 26 : 0) + breathe;
    if (st.stomp) rigY += Math.abs(Math.sin(time * 15)) * -3;
    el.rig.setAttribute('transform',
      'translate(0 ' + rigY.toFixed(2) + ') rotate(' + st.lean.toFixed(2) + ' 192 ' + HIPY + ') ' +
      'translate(192 ' + HIPY + ') scale(' + (1 + sq).toFixed(3) + ' ' + (1 - sq).toFixed(3) + ') translate(-192 ' + (-HIPY) + ')');

    /* head: lags behind the body, droops when napping */
    var tiltT = -st.lean * 0.45 + (sitting ? 9 + Math.sin(time * 1.3) * 2 : 0) + (st.stomp ? Math.sin(time * 15) * 3 : 0);
    st.headTilt = lerp(st.headTilt, tiltT, Math.min(1, dt * 5));
    el.head.setAttribute('transform', 'rotate(' + st.headTilt.toFixed(2) + ' 182 140)');

    /* arms, swung opposite the legs */
    var swing = st.gait * (running ? 34 : 16), a0, a1;
    a0 = 116 + swing * Math.cos(st.phase);
    a1 = 64 - swing * Math.cos(st.phase);
    if (st.gait < 0.1) { a0 += Math.sin(time * 2.2) * 2; a1 -= Math.sin(time * 2.2) * 2; }
    if (st.pose === 'panic') { a0 = 215 + Math.sin(time * 22) * 14; a1 = -35 - Math.sin(time * 22) * 14; }
    else if (st.pose === 'fists') { a0 = 150 + Math.sin(time * 30) * 6; a1 = 30 - Math.sin(time * 30) * 6; }
    else if (st.pose === 'wave') { a1 = -70 + Math.sin(time * 14) * 22; }
    else if (st.pose === 'reach') { a0 = 75; a1 = 55; }
    else if (sitting) { a0 = 100; a1 = 80; }
    if (airborne) { a0 = 150; a1 = 30; }
    el.arm[0].setAttribute('d', armPath(0, a0));
    el.arm[1].setAttribute('d', armPath(1, a1));

    /* face: ease brows/eyes toward the expression */
    var E = EXPR[st.exprName], k = Math.min(1, dt * 14);
    for (var b2 = 0; b2 < 3; b2++) { st.ex.bl[b2] = lerp(st.ex.bl[b2], E.bl[b2], k); st.ex.br[b2] = lerp(st.ex.br[b2], E.br[b2], k); }
    st.ex.es = lerp(st.ex.es, E.es, k);
    el.browL.setAttribute('transform', browT(C.browL, st.ex.bl));
    el.browR.setAttribute('transform', browT(C.browR, st.ex.br));
    if (t > blinkAt) { st.blink = 1; blinkAt = t + rand(2200, 5200); }
    st.blink = Math.max(0, st.blink - dt * 8);
    var bsy = st.ex.es * (1 - 0.88 * Math.sin(Math.PI * st.blink));
    el.eyeL.setAttribute('transform', eyeT(C.eyeL, st.ex.es, bsy));
    el.eyeR.setAttribute('transform', eyeT(C.eyeR, st.ex.es, bsy));
    var c = center(), mx = mouse.x - c.x, my = mouse.y - (st.gy + H * 0.2), md = Math.hypot(mx, my), gx = 0, gy = 0;
    if (md < 500 && md > 1) { gx = mx / md * 4 * (fl < 0 ? -1 : 1); gy = my / md * 3; }
    el.gaze.setAttribute('transform', 'translate(' + gx.toFixed(2) + ' ' + gy.toFixed(2) + ')');

    /* place him */
    el.flip.setAttribute('transform', 'translate(' + (VB.x + VB.w / 2) + ' 0) scale(' + fl.toFixed(3) + ' 1) translate(' + (-(VB.x + VB.w / 2)) + ' 0)');
    var y = st.gy + st.sink + st.jy;
    wrap.style.transform = 'translate(' + st.x.toFixed(2) + 'px,' + y.toFixed(2) + 'px)';
    requestAnimationFrame(frame);
  }

  function boot() {
    document.body.appendChild(wrap);
    expr('neutral');
    st.x = innerWidth + 10; st.gy = maxY();
    requestAnimationFrame(function (t) { last = t; t0 = t; frame(t); });
    start(enter);
  }
  if (document.body) boot(); else document.addEventListener('DOMContentLoaded', boot);

  window.SaltMascot = {
    wind: function () { if (!reduce) start(wind); },
    hide: function () { if (!reduce) start(hide); },
    nap: function () { start(nap); },
    wave: function () { start(wave); },
    wander: function () { if (!reduce) start(wander); },
    expr: expr,
    el: wrap
  };
})();

</script>

</body></html>
